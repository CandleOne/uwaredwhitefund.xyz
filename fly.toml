app = "uwaredwhitefund-api"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORTFOLIO_ALLOWED_ORIGIN = "https://uwaredwhitefund.xyz"
  PORTFOLIO_DATABASE_PATH = "/data/portfolio.db"
  ALLOW_MANAGER_SETUP = "false"

[[mounts]]
  source = "portfolio_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 24
    hard_limit = 30

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"