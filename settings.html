<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="alpaca-api-base" content="https://api.uwaredwhitefund.xyz" />
    <title>Settings | Red &amp; White Fund</title>
    <link rel="stylesheet" href="site.css?v=portfolio-widget" />
    <script src="site.js" defer></script>
    <script src="settings.js" defer></script>
  </head>
  <body>
    <div class="utility-bar">UWA The University of West Alabama</div>
    <header class="site-header">
      <div class="brand">
        <p class="brand-title">Red &amp; White Fund</p>
        <img class="brand-mark" src="assets/uwacollegeofbusiness.png" alt="College of Business" />
      </div>
    </header>
    <main>
      <section class="hero"><div class="hero-content"><h1>Settings</h1></div></section>
      <section class="page-content login-page" aria-labelledby="portfolio-settings-heading">
        <section class="login-panel settings-panel">
          <h2 id="portfolio-settings-heading">Portfolio Settings</h2>
          <p>Manage portfolio connections linked to your member account.</p>
          <p data-owned-portfolio-summary>Loading linked portfolios&hellip;</p>
          <button class="unlink-all-portfolios-button" type="button" data-unlink-all-portfolios hidden>Unlink all my portfolios</button>
          <p class="dashboard-error" data-settings-message role="alert" hidden></p>
          <p class="settings-return-link"><a href="paperdashboard.html">Return to Paper Dashboard</a></p>
        </section>
      </section>
    </main>
  </body>
</html>
